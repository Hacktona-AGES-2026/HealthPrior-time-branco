services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthprior
      POSTGRES_PASSWORD: healthprior
      POSTGRES_DB: healthprior
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthprior -d healthprior"]
      interval: 3s
      timeout: 3s
      retries: 10

  # WhatsApp da DEMO (não oficial): `docker compose --profile whatsapp up -d waha`; QR em http://localhost:3000/dashboard
  waha:
    image: devlikeapro/waha:arm  # Mac com chip Apple; em Intel/Linux use devlikeapro/waha
    profiles: ["whatsapp"]
    environment:  # vêm do .env da raiz; sem eles o WAHA gera credenciais novas a cada início
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - wahasessions:/app/.sessions
    restart: unless-stopped

volumes:
  wahasessions:
  pgdata:
