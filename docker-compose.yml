services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthprior
      POSTGRES_PASSWORD: healthprior
      POSTGRES_DB: healthprior
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthprior -d healthprior"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
