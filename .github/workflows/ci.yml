name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthprior
          POSTGRES_PASSWORD: healthprior
          POSTGRES_DB: healthprior
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthprior"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Testes
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://healthprior:healthprior@localhost:5432/healthprior_test
      - name: Carga e publicação da fila (verificador oficial)
        env:
          HP_DB_URL: postgresql+psycopg://healthprior:healthprior@localhost:5432/healthprior
        run: |
          python -m app.cli init-db
          python -m app.cli carga
          python -m app.cli gerar-fila
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fila_priorizada
          path: backend/output/fila_priorizada.csv
